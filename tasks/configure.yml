---
- name: configure | Set /etc/defaults/telegraf environment variables
  ansible.builtin.copy:
    content: |
      {% for key, value in telegraf_env.items() %}
      {{ key }}="{{ value }}"
      {% endfor %}
    mode: "0600"
    owner: root
    dest: /etc/default/telegraf
  notify:
    - Restart Telegraf

- name: configure | Set templatized Telegraf configuration
  ansible.builtin.template:
    src: "{{ telegraf_configuration_template }}"
    dest: "{{ telegraf_configuration_dir }}/{{ telegraf_config_file | default('telegraf.conf') }}"
    force: true
    backup: false
    owner: telegraf
    group: telegraf
    mode: "0744"
  when: telegraf_template_configuration | default(True)
  notify:
    - Restart Telegraf
  tags:
    - telegraf-config
